version: '3.9'

# ============================================================
# Pocket Monster Go — Production Docker Compose
# Runs directly from source code (no Docker build required)
# Usage: docker compose up -d
# ============================================================

services:

  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: pmg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-pmg}
      POSTGRES_USER:     ${POSTGRES_USER:-pmg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/V1__initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/V2__seed_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    networks:
      - pmg-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmg_user} -d ${POSTGRES_DB:-pmg}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: pmg-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - pmg-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Microservices (run from source via node:20-alpine) ──────
  user-service:
    image: node:20-alpine
    container_name: pmg-user-service
    restart: unless-stopped
    working_dir: /app
    volumes: [./backend:/app]
    command: sh -c "cd /app && npm install --prefix shared --omit=dev 2>/dev/null; cd /app/services/user-service && npm install --omit=dev && node src/index.js"
    environment:
      PORT: "8081"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}   # REQ-00042：设为 http://jaeger:4318 启用链路追踪
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    networks: [pmg-internal]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  location-service:
    image: node:20-alpine
    container_name: pmg-location-service
    restart: unless-stopped
    working_dir: /app
    volumes: [./backend:/app]
    command: sh -c "cd /app/services/location-service && npm install --omit=dev && node src/index.js"
    environment:
      PORT: "8082"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}   # REQ-00042：设为 http://jaeger:4318 启用链路追踪
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    networks: [pmg-internal]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
