      start_period: 40s

  gym-service:
    image: node:20-alpine
    container_name: pmg-gym-service
    restart: unless-stopped
    working_dir: /app
    volumes: [./backend:/app]
    command: sh -c "cd /app/services/gym-service && npm install --omit=dev && node src/index.js"
    environment:
      PORT: "8085"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}   # REQ-00042：设为 http://jaeger:4318 启用链路追踪
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    networks: [pmg-internal]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  social-service:
    image: node:20-alpine
    container_name: pmg-social-service
    restart: unless-stopped
    working_dir: /app
    volumes: [./backend:/app]
    command: sh -c "cd /app/services/social-service && npm install --omit=dev && node src/index.js"
    environment:
      PORT: "8086"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}   # REQ-00042：设为 http://jaeger:4318 启用链路追踪
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    networks: [pmg-internal]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  reward-service:
    image: node:20-alpine
    container_name: pmg-reward-service
    restart: unless-stopped
    working_dir: /app
    volumes: [./backend:/app]
    command: sh -c "cd /app/services/reward-service && npm install --omit=dev && node src/index.js"
    environment:
      PORT: "8087"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}   # REQ-00042：设为 http://jaeger:4318 启用链路追踪
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    networks: [pmg-internal]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  payment-service:
    image: node:20-alpine
    container_name: pmg-payment-service
    restart: unless-stopped
    working_dir: /app
    volumes: [./backend:/app]
    command: sh -c "cd /app/services/payment-service && npm install --omit=dev && node src/index.js"
    environment:
      PORT: "8088"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}   # REQ-00042：设为 http://jaeger:4318 启用链路追踪
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    networks: [pmg-internal]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── API Gateway ───────────────────────────────────────────────
  api-gateway:
    image: node:20-alpine
    container_name: pmg-gateway
    restart: unless-stopped
    working_dir: /app
    volumes: [./backend:/app]
    command: sh -c "cd /app/gateway && npm install --omit=dev && node src/index.js"
    environment:
      PORT: "8080"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}   # REQ-00042：设为 http://jaeger:4318 启用链路追踪
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      USER_SERVICE_URL:     http://user-service:8081
      LOCATION_SERVICE_URL: http://location-service:8082
      POKEMON_SERVICE_URL:  http://pokemon-service:8083
      CATCH_SERVICE_URL:    http://catch-service:8084
      GYM_SERVICE_URL:      http://gym-service:8085
      SOCIAL_SERVICE_URL:   http://social-service:8086
      REWARD_SERVICE_URL:   http://reward-service:8087
      PAYMENT_SERVICE_URL:  http://payment-service:8088
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [pmg-internal]
    depends_on:
      user-service:     {condition: service_healthy}
      location-service: {condition: service_healthy}
      catch-service:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Admin Dashboard (nginx static) ────────────────────────────
  admin-dashboard:
    image: nginx:alpine
    container_name: pmg-admin
    restart: unless-stopped
    volumes:
      - ./frontend/admin-dashboard:/usr/share/nginx/html:ro
    ports:
      - "${ADMIN_PORT:-3000}:80"
    networks: [pmg-internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── 可观测性栈（REQ-00042）：docker compose up monitoring ─────
  # 链路：Jaeger（OTLP）  日志：Alloy → Loki  指标：Prometheus → Alertmanager  可视化：Grafana
  # 应用服务启用链路上报：OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose up -d
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: pmg-jaeger
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_HTTP_PORT:-4318}:4318"     # 宿主机上 PM2 运行的服务也可上报：OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
    networks: [pmg-internal]

  loki:
    image: grafana/loki:3.7.8
    container_name: pmg-loki
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./infrastructure/monitoring/loki/rules:/etc/loki/rules:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks: [pmg-internal]

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: pmg-alloy
    profiles: [monitoring]
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./infrastructure/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [pmg-internal]
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: pmg-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/alertmanager/rules.yml:/etc/prometheus/rules/minego-service.yml:ro
      - ./infrastructure/monitoring/prometheus/task_queue_alerts.yml:/etc/prometheus/rules/task-queue.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [pmg-internal]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: pmg-alertmanager
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infrastructure/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks: [pmg-internal]

  grafana:
    image: grafana/grafana:13.0.9
    container_name: pmg-grafana
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: system
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3300}:3000"     # 3000 已被 admin-dashboard 占用
    networks: [pmg-internal]
    depends_on: [prometheus, loki, jaeger, alertmanager]

  # 一键入口：docker compose up monitoring（带起以上全部组件并打印访问地址）
  monitoring:
    image: busybox:1.37
    container_name: pmg-monitoring
    profiles: [monitoring]
    command: ["sh", "-c", "echo 'mineGo 监控栈已启动：Grafana http://localhost:${GRAFANA_PORT:-3300}  Jaeger http://localhost:${JAEGER_UI_PORT:-16686}  Prometheus http://localhost:${PROMETHEUS_PORT:-9090}  Alertmanager http://localhost:${ALERTMANAGER_PORT:-9093}'; tail -f /dev/null"]
    networks: [pmg-internal]
    depends_on: [grafana, alloy]

volumes:
  postgres_data:
    name: pmg_postgres_data
  redis_data:
    name: pmg_redis_data
  loki_data:
    name: pmg_loki_data
  prometheus_data:
    name: pmg_prometheus_data
  grafana_data:
    name: pmg_grafana_data

networks:
  pmg-internal:
    name: pmg_network
    driver: bridge
