# Epic E25 API 设计规范门禁（REQ-00329 / REQ-00315 / REQ-00547 / REQ-00520 / REQ-00476）
# 模板：推送 token 无 workflow 权限，需由有权限的人拷贝到 .github/workflows/api-standards.yml 后生效；未在 GitHub Actions 实际运行过
name: API Standards

on:
  schedule:
    - cron: '0 18 * * *'   # 每日 02:00（北京时间）跑基准，结果写 api_performance_test_results（REQ-00476）
  pull_request:
    paths:
      - 'backend/**'
      - 'config/performance-budget.yaml'
      - 'config/pipelines/**'
      - 'docs/api-spec/**'
      - 'scripts/api-lint.js'
      - 'scripts/contract-snapshot.js'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  api-lint-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: API 命名规范（error 阻断，warning 仅报告）
        run: node scripts/api-lint.js --all
      - name: 路由文档与代码同步
        run: node scripts/api-lint.js --check-docs
      - name: 契约破坏性变更检测（未审批的 breaking change 阻断）
        run: |
          node scripts/contract-snapshot.js --check
          node scripts/contract-snapshot.js --report > contract-report.md || true
      - name: 生成物同步（TypeScript 类型 / OpenAPI）
        run: |
          node scripts/generate-api-types.js --check
          node scripts/generate-openapi-standards.js --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-report
          path: contract-report.md
      - name: 破坏性变更自动评论到 PR（REQ-00520）
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('contract-report.md')) return;
            const body = fs.readFileSync('contract-report.md', 'utf8');
            if (/破坏性：0（/.test(body)) return; // 无破坏性变更不评论
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `### API 兼容性检查\n\n${body.slice(0, 60000)}\n\n> 未审批的破坏性变更会阻断合并；审批方式见 docs/api-standards/versioning-and-deprecation.md` });

  unit:
    runs-on: ubuntu-latest
    needs: api-lint-and-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd backend && npm ci
      - run: cd backend && npm run test:api-standards

  performance-gate:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env: { POSTGRES_DB: pmg_ci, POSTGRES_USER: pmg_ci, POSTGRES_PASSWORD: pmg_ci }
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd backend && npm ci
      - name: 启动服务
        run: |
          node database/bootstrap-dev.js
          npx pm2 start ecosystem.config.js
      - name: 契约测试（从契约自动生成用例，经网关执行）
        run: BASE_URL=http://127.0.0.1:8080 node scripts/contract-test.js --run
      - name: 基准测试（P95 超预算或 P99 较基线退化 > 20% 则失败）
        run: BASE_URL=http://127.0.0.1:8080 node scripts/bench-api-performance.js --baseline config/performance-baseline.json --gate --record-db
