# Prometheus（REQ-00042，docker compose 监控栈）：抓取 mineGo 各服务 /metrics，评估告警规则并发往 Alertmanager
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 每个服务一个 job（job=minego-<服务>），与 infrastructure/k8s/monitoring/prometheus-rules.yml 中 up{job=~"minego-.*"} 一致；
  # 指标自带 service 标签（shared/metrics.js）
  - job_name: minego-gateway
    static_configs: [{ targets: ['api-gateway:8080'] }]
  - job_name: minego-user-service
    static_configs: [{ targets: ['user-service:8081'] }]
  - job_name: minego-location-service
    static_configs: [{ targets: ['location-service:8082'] }]
  - job_name: minego-pokemon-service
    static_configs: [{ targets: ['pokemon-service:8083'] }]
  - job_name: minego-catch-service
    static_configs: [{ targets: ['catch-service:8084'] }]
  - job_name: minego-gym-service
    static_configs: [{ targets: ['gym-service:8085'] }]
  - job_name: minego-social-service
    static_configs: [{ targets: ['social-service:8086'] }]
  - job_name: minego-reward-service
    static_configs: [{ targets: ['reward-service:8087'] }]
  - job_name: minego-payment-service
    static_configs: [{ targets: ['payment-service:8088'] }]

  - job_name: jaeger
    static_configs: [{ targets: ['jaeger:8888'] }]   # Jaeger v2 内部指标
  - job_name: loki
    static_configs: [{ targets: ['loki:3100'] }]
