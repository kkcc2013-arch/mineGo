# Loki 单实例（REQ-00042，本地/测试环境；生产需对象存储 + 多副本）
auth_enabled: false            # 单租户，租户 ID 固定为 "fake"（ruler 规则目录 rules/fake/）

server:
  http_listen_port: 3100
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h                # 日志保留 7 天
  allow_structured_metadata: true       # trace_id 作为结构化元数据（高基数，不做标签）
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# 基于日志的告警（LogQL），规则见 rules/fake/minego-logs.yml
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  enable_alertmanager_v2: true
  ring:
    kvstore:
      store: inmemory
