# Grafana 数据源（REQ-00042）：Prometheus 指标、Loki 日志、Jaeger 链路互相关联
#   Loki 日志中的 trace_id → 点击跳转 Jaeger 链路（派生字段）
#   Jaeger span → 查看同一 trace_id 的日志（tracesToLogsV2）
# 注意：Grafana 会展开 provisioning 文件中的 $VAR，字面量 $ 需写成 $$。
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          datasourceUid: jaeger
          url: '$${__value.raw}'
          urlDisplayLabel: 在 Jaeger 中查看链路

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        customQuery: true
        query: '{job="minego"} | trace_id="$${__trace.traceId}"'

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
