name: MFA browser and offline credential regression
on:
  pull_request:
    paths:
      - 'frontend/game-client/**'
      - 'backend/shared/**'
      - 'backend/services/user-service/**'
      - 'backend/tests/regression/mfa-browser-storage.test.js'
      - 'backend/tests/unit/mfa-client.test.js'
      - 'backend/package*.json'
      - 'database/migrations/V1__initial_schema.sql'
      - 'database/pending/*mfa*.sql'
      - 'database/pending/*sensitive_data*.sql'
      - 'database/pending/repairs/**'
      - 'database/migrate.js'
      - 'database/sqlStatements.js'
      - '.github/workflows/mfa-client-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mfa-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_DB: minego_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      UV_THREADPOOL_SIZE: '2'
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      TEST_REDIS_URL: redis://localhost:6379
      MFA_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/mfa-browser-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/game-client/package-lock.json
      - name: Install declared backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install declared browser dependencies
        working-directory: frontend/game-client
        run: npm ci
      - name: Install matching Chromium
        working-directory: frontend/game-client
        run: npx playwright install --with-deps chromium
      - name: Verify factor, cancellation and token boundaries
        working-directory: backend
        run: node --test --test-concurrency=1 tests/unit/mfa-client.test.js
      - name: Exercise actual game UI and service worker with real PostgreSQL and Redis
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/mfa-browser-storage.test.js
      - name: Preserve screens without factors or tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfa-browser-screens
          path: mfa-browser-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
