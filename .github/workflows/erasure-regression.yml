name: UUID erasure request and protected workflow regression
on:
  pull_request:
    paths:
      - 'backend/shared/**'
      - 'backend/services/user-service/**'
      - 'backend/gateway/src/middleware/mfaRequired.js'
      - 'backend/gateway/src/index.js'
      - 'backend/tests/regression/erasure-*.test.js'
      - 'backend/package*.json'
      - 'database/**'
      - '.github/workflows/erasure-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  erasure-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_DB: minego_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d minego_test" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      UV_THREADPOOL_SIZE: '2'
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci
      - name: Preserve authentic legacy identities and verify UUID storage/receipt accounting
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/erasure-schema-storage.test.js
      - name: Verify actual owner/admin HTTP, nonce use, approval, encrypted audit and signature reads
        working-directory: backend
        run: npm run test:erasure:storage
      - name: Inspect actual complete-schema ownership, cascades, triggers and review blockers
        working-directory: backend
        run: npm run test:erasure:plan
