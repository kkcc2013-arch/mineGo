name: Performance Regression Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL of the running test or staging API'
        required: true
      endpoints:
        description: 'API endpoints to test (comma-separated, or "all")'
        required: false
        default: 'all'
      iterations:
        description: 'Number of test iterations per endpoint'
        required: false
        default: '50'
      threshold:
        description: 'Regression threshold percentage'
        required: false
        default: '20'

jobs:
  performance-regression:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: minego_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      
      - name: Create performance tables
        run: |
          PGPASSWORD=test123 psql -h localhost -U test -d minego_test -f database/migrations/20260708_010800_performance_regression_tables.sql
        env:
          PGPASSWORD: test123
      
      - name: Require a live API target
        run: test -n "$API_BASE_URL" || { echo '::error::Configure PERF_BASE_URL or supply the workflow base_url input. Live API performance has not been verified.'; exit 1; }
        env:
          API_BASE_URL: ${{ inputs.base_url || vars.PERF_BASE_URL }}

      - name: Run performance regression tests
        id: perf-test
        run: |
          node tests/regression/run-regression-tests.js \
            --endpoints="${{ github.event.inputs.endpoints || 'all' }}" \
            --iterations="${{ github.event.inputs.iterations || 50 }}" \
            --threshold="${{ github.event.inputs.threshold || 20 }}"
        working-directory: backend
        env:
          DATABASE_URL: postgres://test:test123@localhost:5432/minego_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          API_BASE_URL: ${{ inputs.base_url || vars.PERF_BASE_URL }}
      
      - name: Generate performance report
        if: always() && steps.perf-test.outcome != 'skipped'
        run: |
          node tests/regression/generate-performance-report.js
        working-directory: backend
        env:
          DATABASE_URL: postgres://test:test123@localhost:5432/minego_test
      
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-regression-report
          path: |
            backend/test-results/performance/
            backend/performance-report.md
          retention-days: 30
      
      - name: Publish performance summary
        if: always()
        run: |
          if [ -f backend/test-results/performance/regression-report.md ]; then
            cat backend/test-results/performance/regression-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Live API benchmark did not produce a report; performance is unverified.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update baseline (on main branch push)
        if: success() && github.ref == 'refs/heads/main'
        run: |
          node tests/regression/update-baselines.js
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
      
  # 单元测试任务
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: minego_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      
      - name: Run performance unit tests and enforce measured coverage
        run: npm run test:performance:unit
        working-directory: backend
        env:
          NODE_ENV: test

      - name: Verify real performance storage and retention
        run: npm run test:performance:storage
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
          TEST_REDIS_URL: redis://localhost:6379

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 30