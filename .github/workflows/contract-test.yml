name: API Contract Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docs/schemas/**'
      - '.github/workflows/contract-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/schemas/**'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: minego
          POSTGRES_PASSWORD: minego123
          POSTGRES_DB: minego_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Contract Tests
        working-directory: backend
        env:
          NODE_ENV: test
          API_BASE_URL: ${{ vars.CONTRACT_BASE_URL }}
          CONTRACT_FIXTURES_PATH: ${{ vars.CONTRACT_FIXTURES_PATH }}
        run: npm run test:contract

      - name: Upload Contract Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-test-report
          path: backend/tests/contract/reports/
          retention-days: 30

      - name: Publish report summary
        if: always()
        run: |
          if [ -f backend/tests/contract/reports/contract-test-report.md ]; then
            cat backend/tests/contract/reports/contract-test-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Contract verification did not produce a report; the test API and fixtures must be configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

  schema-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Schema Definitions
        run: |
          echo "Validating schema definitions..."
          
          # 检查所有 Schema 文件是否符合规范
          for schema_file in docs/schemas/*.schema.json; do
            if [ -f "$schema_file" ]; then
              echo "Validating $schema_file"
              
              # 检查必需字段
              if ! jq -e '.["$schema"]' "$schema_file" > /dev/null; then
                echo "Error: $schema_file missing \$schema field"
                exit 1
              fi
              
              if ! jq -e '.type' "$schema_file" > /dev/null; then
                echo "Error: $schema_file missing type field"
                exit 1
              fi
              
              echo "✓ $schema_file is valid"
            fi
          done

      - name: Check for Breaking Changes
        run: |
          echo "Checking for breaking changes in schemas..."
          
          # 如果有旧的 Schema，对比差异
          if [ -d "docs/schemas/previous" ]; then
            echo "Comparing with previous schema versions..."
            
            for new_schema in docs/schemas/*.schema.json; do
              schema_name=$(basename "$new_schema")
              old_schema="docs/schemas/previous/$schema_name"
              
              if [ -f "$old_schema" ]; then
                echo "Comparing $schema_name..."
                # 这里可以添加更详细的对比逻辑
              fi
            done
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [contract-tests, schema-validation]
    if: failure()
    
    steps:
      - name: Notify on failure
        run: |
          echo "Contract tests failed. Please review the test results."
          # 可以在这里添加 Slack/Email 通知逻辑