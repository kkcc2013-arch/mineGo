name: Database migration regression
on:
  pull_request:
    paths:
      - 'database/**'
      - 'backend/shared/db.js'
      - 'backend/shared/TransactionManager.js'
      - 'backend/shared/transactionManager.js'
      - 'backend/shared/transactionMetrics.js'
      - 'backend/shared/pgDeadlock.js'
      - 'backend/shared/pgCancel.js'
      - 'backend/shared/deadlockDetector.js'
      - 'backend/tests/regression/transaction-storage.test.js'
      - 'backend/tests/regression/transaction-tls-cancel.test.js'
      - 'backend/tests/regression/slow-query-schema-storage.test.js'
      - 'backend/tests/performance/transaction-throughput.js'
      - 'backend/tests/unit/transaction*.test.js'
      - 'backend/shared/auth.js'
      - 'backend/shared/metrics.js'
      - 'backend/shared/achievementTriggers.js'
      - 'backend/tests/unit/migrat*.test.js'
      - 'backend/tests/regression/migration-storage.test.js'
      - 'backend/tests/regression/database-bootstrap.test.js'
      - 'backend/tests/regression/migration-prerequisites.test.js'
      - 'backend/tests/regression/inventory-organization-storage.test.js'
      - 'backend/tests/regression/cosmetic-schema-storage.test.js'
      - 'backend/tests/regression/erasure-schema-storage.test.js'
      - 'backend/tests/regression/canary-schema-storage.test.js'
      - 'backend/tests/regression/partition-maintenance-storage.test.js'
      - 'backend/gateway/src/routes/partitions.js'
      - 'backend/tests/regression/cdc-invalidation-storage.test.js'
      - 'backend/tests/regression/audit-partition-storage.test.js'
      - 'backend/tests/regression/partition-history-storage.test.js'
      - 'backend/tests/regression/currency-storage.test.js'
      - 'backend/shared/exchangeRateService.js'
      - 'backend/shared/currencyFormatter.js'
      - 'backend/shared/currencyMetrics.js'
      - 'backend/services/payment-service/src/routes/currency.js'
      - 'backend/services/payment-service/src/index.js'
      - 'backend/tests/regression/achievement-storage.test.js'
      - 'backend/tests/regression/notification-storage.test.js'
      - 'backend/tests/regression/friendship-storage.test.js'
      - 'backend/tests/regression/catch-risk-storage.test.js'
      - 'backend/shared/catchAnomalyDetector.js'
      - 'backend/shared/specialIv.js'
      - 'backend/services/location-service/src/index.js'
      - 'backend/tests/regression/special-iv-storage.test.js'
      - 'backend/tests/regression/daily-quest-storage.test.js'
      - 'backend/tests/regression/title-upgrade-storage.test.js'
      - 'backend/tests/regression/reward-leaderboard-storage.test.js'
      - 'backend/tests/regression/move-damage-storage.test.js'
      - 'backend/tests/regression/voice-schema-storage.test.js'
      - 'backend/shared/damageCalculator.js'
      - 'backend/shared/typeChart.js'
      - 'backend/services/gym-service/src/damageEngine.js'
      - 'backend/services/gym-service/src/routes/damage.js'
      - 'backend/services/gym-service/src/index.js'
      - 'backend/services/pokemon-service/src/moveService.js'
      - 'backend/services/pokemon-service/src/routes/moves.js'
      - 'backend/services/reward-service/src/index.js'
      - 'backend/services/reward-service/src/routes/dailyQuests.js'
      - 'backend/services/user-service/src/notificationService.js'
      - 'backend/services/user-service/src/routes/messageCenter.js'
      - 'backend/services/user-service/src/routes/notifications.js'
      - 'backend/shared/notification/**'
      - 'backend/shared/NotificationWebSocket.js'
      - 'backend/shared/ServiceLauncher.js'
      - 'backend/shared/clientIp.js'
      - 'backend/gateway/src/routes/notificationProxy.js'
      - 'backend/services/pokemon-service/src/achievementService.js'
      - 'backend/services/pokemon-service/src/index.js'
      - 'backend/services/pokemon-service/src/routes/achievements.js'
      - 'backend/services/user-service/src/routes/user.js'
      - 'backend/package*.json'
      - '.github/workflows/migration-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_DB: minego_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install declared backend dependencies
        working-directory: backend
        run: npm ci
      - name: Enable actual statement statistics in the isolated CI database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U test -d minego_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          umask 077
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -sha256 -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 -keyout "$RUNNER_TEMP/minego-postgres-test.key" -out "$RUNNER_TEMP/minego-postgres-test.crt"
          docker exec -i -u 0 "$POSTGRES_CONTAINER" sh -c 'umask 077; cat > /var/lib/postgresql/data/server.key' < "$RUNNER_TEMP/minego-postgres-test.key"
          docker exec -i -u 0 "$POSTGRES_CONTAINER" sh -c 'cat > /var/lib/postgresql/data/server.crt' < "$RUNNER_TEMP/minego-postgres-test.crt"
          docker exec -u 0 "$POSTGRES_CONTAINER" chown postgres:postgres /var/lib/postgresql/data/server.key /var/lib/postgresql/data/server.crt
          docker exec -u 0 "$POSTGRES_CONTAINER" chmod 600 /var/lib/postgresql/data/server.key
          docker exec "$POSTGRES_CONTAINER" psql -U test -d minego_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl = 'on'"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U test -d minego_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Check actual SQL parsing and transaction ownership
        working-directory: backend
        run: npm run test:migrations:unit
      - name: Verify canonical identity-only CDC storage and refusal of customized contracts
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/cdc-invalidation-storage.test.js
        env:
          UV_THREADPOOL_SIZE: '2'
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Check actual CLI checksums, concurrency, rollback and interrupted ownership
        working-directory: backend
        run: npm run test:migrations:storage
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify actual inventory catalog, UUID identities and data-preserving prerequisite rollback
        working-directory: backend
        run: node --test tests/regression/migration-prerequisites.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify inventory organization data, UUID teams, preferences and guarded legacy adoption
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/inventory-organization-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify cosmetic UUID references, original catalog and retained purchase history
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/cosmetic-schema-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify retained legacy deletion identities and accountable UUID erasure storage
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/erasure-schema-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify retained canary history, actual rollout uniqueness and runtime boundaries
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/canary-schema-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify audit conversion, canonical partition history, concurrent IDs and data-preserving rollback
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/audit-partition-storage.test.js tests/regression/partition-history-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify canonical partition maintenance, real statistics and protected operational routes
        working-directory: backend
        run: node --test --test-concurrency=1 --experimental-test-coverage --test-coverage-include='**/partitionMaintenance.js' --test-coverage-lines=80 --test-coverage-functions=80 tests/regression/partition-maintenance-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify existing tiered data, modern progress, real rewards and authenticated achievement routes
        working-directory: backend
        run: node --test tests/regression/achievement-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify actual notification history, preferences, signed APIs and live recipient sockets
        working-directory: backend
        run: node --test tests/regression/notification-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify UUID trainer bonds, affinity projections, positive/negative history and guarded rollback
        working-directory: backend
        run: node --test tests/regression/friendship-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify gameplay catch identity, actual throw evidence and durable risk statistics
        working-directory: backend
        run: node --test tests/regression/catch-risk-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify actual IV flags, ownership counts, generation and equipment SQL contracts
        working-directory: backend
        run: node --test tests/regression/special-iv-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify quest date indexes and actual mounted atomic daily reward claims
        working-directory: backend
        run: node --test tests/regression/daily-quest-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify guarded title history upgrades and actual reward ranking parameters
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/title-upgrade-storage.test.js tests/regression/reward-leaderboard-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify preserved canonical moves, real TM transactions and signed damage simulations
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/move-damage-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify actual voice schema, membership history and TURN expiry index preservation
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/voice-schema-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify preserved real orders, atomic rates, owned locks and signed currency routes
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/currency-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify actual transaction isolation, deadlines, contention and owned pool cleanup
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/transaction-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify actual slow-query history, numeric ratios and live PostgreSQL execution helpers
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/slow-query-schema-storage.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify owned TLS query cancellation and refusal of an encryption downgrade
        working-directory: backend
        run: node --test --test-concurrency=1 tests/regression/transaction-tls-cancel.test.js
        env:
          TEST_SSL_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
          TEST_DATABASE_SSL_CA: ${{ runner.temp }}/minego-postgres-test.crt
      - name: Enforce original transaction throughput regression ceiling against published predecessor
        working-directory: backend
        run: node tests/performance/transaction-throughput.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
      - name: Verify complete fresh production schema, seeding and pending migration history
        if: ${{ success() || failure() }}
        working-directory: backend
        run: node --test tests/regression/database-bootstrap.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/minego_test
