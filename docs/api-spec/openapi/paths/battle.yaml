# 由 E11 实现时整理：战斗与技能相关接口（经网关 /v1 访问，除标注"公开"外均需 Bearer Token）
# 实时通道：WebSocket /ws/raid?token&raidId（团战，仅参与者）、/ws/battle?token（实时对战，JWT 鉴权，拒绝已吊销令牌）
# 错误响应：{ success:false, code:"<业务码>", message, details } ，业务码见各接口说明
paths:
  /gyms/nearby:
    get:
      tags: ["Gym Battle"]
      summary: "附近道馆（PostGIS ST_DWithin，含进行中的团战）"
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: radius, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /gyms/{gymId}:
    get:
      tags: ["Gym Battle"]
      summary: "道馆详情与驻守精灵"
      parameters:
        - { name: gymId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /gyms/{gymId}/defend:
    post:
      tags: ["Gym Battle"]
      summary: "派驻精灵（需在道馆 100 米内；己方或中立道馆；最多 6 只；每人每馆 1 只）"
      parameters:
        - { name: gymId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"pokemonId": {"type": "string", "format": "uuid"}}}
      responses:
        '200':
          description: "成功"
        '400':
          description: "位置过远 TOO_FAR / 道馆已满 GYM_FULL / 敌方道馆 GYM_ENEMY"
        '401':
          description: "未登录"
  /gyms/{gymId}/battle/start:
    post:
      tags: ["Gym Battle"]
      summary: "开始道馆挑战（服务端计算伤害；返回战斗状态、AI 胜率预测、新手建议）"
      parameters:
        - { name: gymId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"pokemonIds": {"type": "array", "items": {"type": "string", "format": "uuid"}, "minItems": 1, "maxItems": 6}}}
      responses:
        '200':
          description: "成功"
        '400':
          description: "TOO_FAR / GYM_OWN_TEAM / GYM_EMPTY / POKEMON_UNAVAILABLE / POKEMON_DEFENDING"
        '409':
          description: "BATTLE_IN_PROGRESS"
        '401':
          description: "未登录"
  /gyms/battles/history:
    get:
      tags: ["Gym Battle"]
      summary: "我的道馆对战记录（含回放 ID）"
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /gyms/battles/{battleId}:
    get:
      tags: ["Gym Battle"]
      summary: "当前战斗状态与最近 10 回合"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /gyms/battles/{battleId}/turn:
    post:
      tags: ["Gym Battle"]
      summary: "出招：只提交技能 ID（客户端伤害字段被忽略）；useAdvice=true 一键执行 AI 推荐"
      description: "战斗结束时响应含 result（结算、奖励、联赛积分、精彩时刻、AI 复盘、replayId）"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"moveId": {"type": "string"}, "useAdvice": {"type": "boolean"}}}
      responses:
        '200':
          description: "成功"
        '400':
          description: "INVALID_MOVE / MOVE_COOLDOWN / INSUFFICIENT_ENERGY"
        '403':
          description: "FORBIDDEN"
        '409':
          description: "BATTLE_ENDED / BATTLE_BUSY"
        '401':
          description: "未登录"
  /gyms/battles/{battleId}/switch:
    post:
      tags: ["Gym Battle"]
      summary: "换人（消耗一回合，守方行动一次）"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"pokemonId": {"type": "string", "format": "uuid"}}}
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /gyms/battles/{battleId}/combo:
    post:
      tags: ["Gym Battle"]
      summary: "一键释放连招预设（步骤延迟计入连击时间窗口）"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"presetId": {"type": "string", "format": "uuid"}}}
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /gyms/battles/{battleId}/forfeit:
    post:
      tags: ["Gym Battle"]
      summary: "认输"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /gyms/battles/{battleId}/advice:
    get:
      tags: ["Gym Battle"]
      summary: "AI 实时建议（排序、理由、换人建议、连击提示、胜率预测；计每日配额）"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '429':
          description: "AI_QUOTA_EXCEEDED"
        '401':
          description: "未登录"
  /gyms/battles/{battleId}/predict:
    get:
      tags: ["Gym Battle"]
      summary: "蒙特卡洛胜率预测"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /gyms/battles/{battleId}/replay:
    get:
      tags: ["Gym Battle"]
      summary: "该场战斗的回放"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/sessions/{battleId}:
    get:
      tags: ["Battle Session"]
      summary: "当前战斗状态与最近 10 回合"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/sessions/{battleId}/turn:
    post:
      tags: ["Battle Session"]
      summary: "出招：只提交技能 ID（客户端伤害字段被忽略）；useAdvice=true 一键执行 AI 推荐"
      description: "战斗结束时响应含 result（结算、奖励、联赛积分、精彩时刻、AI 复盘、replayId）"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"moveId": {"type": "string"}, "useAdvice": {"type": "boolean"}}}
      responses:
        '200':
          description: "成功"
        '400':
          description: "INVALID_MOVE / MOVE_COOLDOWN / INSUFFICIENT_ENERGY"
        '403':
          description: "FORBIDDEN"
        '409':
          description: "BATTLE_ENDED / BATTLE_BUSY"
        '401':
          description: "未登录"
  /battle/sessions/{battleId}/switch:
    post:
      tags: ["Battle Session"]
      summary: "换人（消耗一回合，守方行动一次）"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"pokemonId": {"type": "string", "format": "uuid"}}}
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/sessions/{battleId}/combo:
    post:
      tags: ["Battle Session"]
      summary: "一键释放连招预设（步骤延迟计入连击时间窗口）"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"presetId": {"type": "string", "format": "uuid"}}}
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/sessions/{battleId}/forfeit:
    post:
      tags: ["Battle Session"]
      summary: "认输"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/sessions/{battleId}/advice:
    get:
      tags: ["Battle Session"]
      summary: "AI 实时建议（排序、理由、换人建议、连击提示、胜率预测；计每日配额）"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '429':
          description: "AI_QUOTA_EXCEEDED"
        '401':
          description: "未登录"
  /battle/sessions/{battleId}/predict:
    get:
      tags: ["Battle Session"]
      summary: "蒙特卡洛胜率预测"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/sessions/{battleId}/replay:
    get:
      tags: ["Battle Session"]
      summary: "该场战斗的回放"
      parameters:
        - { name: battleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /raids/nearby:
    get:
      tags: ["Raid"]
      summary: "附近团战"
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: radius, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /raids/spawn:
    post:
      tags: ["Raid"]
      summary: "生成团战（管理员）"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"gymId": {"type": "string", "format": "uuid"}, "speciesId": {"type": "integer"}, "level": {"type": "integer"}, "startsInMin": {"type": "integer"}, "durationMin": {"type": "integer"}}}
      responses:
        '200':
          description: "成功"
        '403':
          description: "需要管理员"
        '409':
          description: "RAID_EXISTS"
        '401':
          description: "未登录"
  /raids/{raidId}:
    get:
      tags: ["Raid"]
      summary: "团战详情（Boss 技能与弱点、我的参与情况）"
      parameters:
        - { name: raidId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /raids/{raidId}/join:
    post:
      tags: ["Raid"]
      summary: "加入团战（100 米内；可指定 pokemonIds，否则取 CP 最高 6 只）"
      parameters:
        - { name: raidId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"pokemonIds": {"type": "array", "items": {"type": "string", "format": "uuid"}, "maxItems": 6}}}
      responses:
        '200':
          description: "成功"
        '400':
          description: "TOO_FAR / RAID_FULL"
        '409':
          description: "RAID_NOT_ACTIVE"
        '401':
          description: "未登录"
  /raids/{raidId}/attack:
    post:
      tags: ["Raid"]
      summary: "攻击 Boss：伤害服务端计算，按技能 duration_ms 限频"
      description: "WebSocket /ws/raid?token&raidId 发送 {type:\"ATTACK\", moveId, requestId} 等价；服务端回 ATTACK_RESULT / ERROR，并广播 RAID_ATTACK / RAID_COMPLETED"
      parameters:
        - { name: raidId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"moveId": {"type": "string"}, "pokemonId": {"type": "string", "format": "uuid"}}}
      responses:
        '200':
          description: "成功"
        '403':
          description: "NOT_PARTICIPANT"
        '429':
          description: "ATTACK_TOO_FAST（details.retryAfterMs）"
        '409':
          description: "RAID_NOT_ACTIVE"
        '401':
          description: "未登录"
  /raids/{raidId}/switch:
    post:
      tags: ["Raid"]
      summary: "更换团战出战精灵"
      parameters:
        - { name: raidId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"pokemonId": {"type": "string", "format": "uuid"}}}
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /raids/{raidId}/result:
    get:
      tags: ["Raid"]
      summary: "伤害排行与奖励"
      parameters:
        - { name: raidId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/pokemon/{pokemonId}/energy:
    get:
      tags: ["Energy & Cooldown"]
      summary: "能量池与战斗中实时能量/冷却（别名 GET /api/pokemon/{id}/energy）"
      parameters:
        - { name: pokemonId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/pokemon/{pokemonId}/energy/regenerate:
    post:
      tags: ["Energy & Cooldown"]
      summary: "按经过时间结算自然回复（别名 POST /api/pokemon/{id}/energy/regenerate）"
      parameters:
        - { name: pokemonId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/pokemon/{pokemonId}/moves/check:
    post:
      tags: ["Energy & Cooldown"]
      summary: "技能可用性检查（别名 POST /api/pokemon/{id}/moves/check）"
      parameters:
        - { name: pokemonId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"moveId": {"type": "string"}}}
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/pokemon/{pokemonId}/cooldowns:
    get:
      tags: ["Energy & Cooldown"]
      summary: "冷却明细与预测建议（熟练度/连击/速度/装备/天气/模式）"
      parameters:
        - { name: pokemonId, in: path, required: true, schema: { type: string } }
        - { name: mode, in: query, required: false, schema: { type: string } }
        - { name: weather, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/pokemon/{pokemonId}/mastery:
    get:
      tags: ["Energy & Cooldown"]
      summary: "技能熟练度（0-100 → 冷却 -0~15%）"
      parameters:
        - { name: pokemonId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/moves/{moveId}/energy-info:
    get:
      tags: ["Energy & Cooldown"]
      summary: "技能能量与四种模式下的冷却"
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/equipment/catalog:
    get:
      tags: ["Energy & Cooldown"]
      summary: "冷却装备目录（宝石/符文/神器，合计上限 30%）"
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/equipment/mine:
    get:
      tags: ["Energy & Cooldown"]
      summary: "我的冷却装备"
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/equipment/{itemId}/equip:
    post:
      tags: ["Energy & Cooldown"]
      summary: "装备到精灵（每类 1 件）"
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"pokemonId": {"type": "string", "format": "uuid"}}}
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/equipment/{itemId}/unequip:
    post:
      tags: ["Energy & Cooldown"]
      summary: "卸下装备"
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/equipment/grant:
    post:
      tags: ["Energy & Cooldown"]
      summary: "发放装备（管理员）"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"userId": {"type": "string", "format": "uuid"}, "equipmentId": {"type": "string"}}}
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/combos:
    get:
      tags: ["Combo"]
      summary: "连击链列表（解锁状态）"
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/combos/my/stats:
    get:
      tags: ["Combo"]
      summary: "我的连击统计"
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/combos/leaderboard:
    get:
      tags: ["Combo"]
      summary: "连击排行榜"
      parameters:
        - { name: chainId, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/combos/logs:
    get:
      tags: ["Combo"]
      summary: "连击使用日志"
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/combos/recommend/{pokemonId}:
    get:
      tags: ["Combo"]
      summary: "按精灵已掌握技能推荐可用连击链"
      parameters:
        - { name: pokemonId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/combos/presets:
    get:
      tags: ["Combo"]
      summary: "连招预设列表"
      parameters:
        - { name: pokemonId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
    post:
      tags: ["Combo"]
      summary: "创建连招预设（每只精灵 ≤5 套，每套 2-5 步）"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"pokemonId": {"type": "string", "format": "uuid"}, "name": {"type": "string"}, "isDefault": {"type": "boolean"}, "steps": {"type": "array", "minItems": 2, "maxItems": 5, "items": {"type": "object", "properties": {"moveId": {"type": "string"}, "delayMs": {"type": "integer"}, "condition": {"type": "object", "properties": {"type": {"type": "string", "enum": ["energy_gte", "target_hp_lte_pct", "self_hp_gte_pct"]}, "value": {"type": "number"}}}}}}}}
      responses:
        '200':
          description: "成功"
        '401':
          description: "未登录"
  /battle/combos/presets/{presetId}:
    put:
      tags: ["Combo"]
      summary: "编辑连招预设 / 设为默认"
      parameters:
        - { name: presetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"name": {"type": "string"}, "isDefault": {"type": "boolean"}, "steps": {"type": "array", "items": {"type": "object"}}}}
