components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  parameters:
    Fields:
      name: "fields"
      in: "query"
      schema:
        type: "string"
      description: "字段投影，如 id,cp,moves[].name（最多 50 个）"
    Fieldset:
      name: "fieldset"
      in: "query"
      schema:
        type: "string"
      description: "预定义字段集（list/detail/battle/social…）"
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        default: 1
    PageSize:
      name: "pageSize"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: "cursor"
      in: "query"
      schema:
        type: "string"
    AcceptVersion:
      name: "Accept-Version"
      in: "header"
      schema:
        type: "integer"
  schemas:
    Deprecation:
      type: "object"
      required:
        - "deprecated"
        - "migrationGuide"
      properties:
        deprecated:
          const: true
        deprecatedAt:
          type: "string"
          format: "date-time"
        sunsetAt:
          type:
            - "string"
            - "null"
        daysRemaining:
          type:
            - "integer"
            - "null"
        successorApi:
          type:
            - "string"
            - "null"
        migrationGuide:
          type: "string"
        breakingChanges:
          type: "array"
    ErrorObject:
      type: "object"
      required:
        - "code"
        - "name"
        - "message"
      properties:
        code:
          type:
            - "integer"
            - "string"
        name:
          type: "string"
          pattern: "^[A-Z][A-Z0-9_]+$"
        message:
          type: "string"
        httpStatus:
          type: "integer"
        i18nKey:
          type: "string"
        docUrl:
          type: "string"
        retryable:
          type: "boolean"
        retryAfter:
          type: "number"
        details: {}
    ErrorResponse:
      type: "object"
      description: "统一错误响应（error 为旧格式字符串时标准对象在 errorInfo）"
      required:
        - "success"
        - "code"
        - "message"
        - "error"
      properties:
        success:
          const: false
        code:
          type:
            - "integer"
            - "string"
        message:
          type: "string"
        error:
          anyOf:
            - $ref: "#/components/schemas/ErrorObject"
            - type: "string"
        errorInfo:
          $ref: "#/components/schemas/ErrorObject"
        meta:
          $ref: "#/components/schemas/Meta"
    Link:
      type: "object"
      required:
        - "href"
      properties:
        href:
          type: "string"
        method:
          type: "string"
          enum:
            - "GET"
            - "POST"
            - "PUT"
            - "PATCH"
            - "DELETE"
        title:
          type: "string"
        templated:
          type: "boolean"
    Links:
      type: "object"
      description: "HAL 链接集合"
      additionalProperties:
        $ref: "#/components/schemas/Link"
    Meta:
      type: "object"
      description: "响应元信息"
      properties:
        requestId:
          type: "string"
        timestamp:
          type: "string"
          format: "date-time"
        apiVersion:
          type: "integer"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Pagination:
      type: "object"
      description: "分页元数据（offset 与 cursor 两种分页的并集）"
      required:
        - "type"
        - "pageSize"
        - "hasNext"
        - "hasPrev"
      properties:
        type:
          type: "string"
          enum:
            - "offset"
            - "cursor"
        page:
          type:
            - "integer"
            - "null"
        pageSize:
          type: "integer"
          minimum: 1
        limit:
          type: "integer"
          minimum: 1
        offset:
          type:
            - "integer"
            - "null"
          minimum: 0
        total:
          type:
            - "integer"
            - "null"
        totalPages:
          type:
            - "integer"
            - "null"
        hasMore:
          type: "boolean"
        hasNext:
          type: "boolean"
        hasPrev:
          type: "boolean"
        nextCursor:
          type:
            - "string"
            - "null"
        prevCursor:
          type:
            - "string"
            - "null"
    SuccessEnvelope:
      type: "object"
      description: "成功响应信封：旧客户端依赖 code=0 与 data"
      required:
        - "success"
        - "code"
        - "data"
      properties:
        success:
          const: true
        code:
          const: 0
        message:
          type: "string"
        data: {}
        meta:
          $ref: "#/components/schemas/Meta"
        pagination:
          $ref: "#/components/schemas/Pagination"
        _links:
          $ref: "#/components/schemas/Links"
        deprecation:
          $ref: "#/components/schemas/Deprecation"
        timestamp:
          type: "string"
    WildPokemon:
      type: "object"
      required:
        - "id"
        - "species_id"
        - "lat"
        - "lng"
      properties:
        id:
          type: "string"
        species_id:
          type: "integer"
        lat:
          type:
            - "string"
            - "number"
        lng:
          type:
            - "string"
            - "number"
        cp:
          type: "integer"
        is_shiny:
          type: "boolean"
        expires_at:
          type: "string"
        rarity:
          type:
            - "string"
            - "null"
    BatchResponse:
      type: "object"
      required:
        - "responses"
        - "summary"
      properties:
        responses:
          type: "array"
          items:
            type: "object"
            required:
              - "id"
              - "status"
              - "duration"
            properties:
              id:
                type: "string"
              status:
                type: "integer"
              data: {}
              error: {}
              cached:
                type: "boolean"
              duration:
                type: "integer"
              priority:
                type: "string"
        summary:
          type: "object"
          required:
            - "total"
            - "success"
            - "failed"
            - "cached"
            - "totalDuration"
            - "costSaved"
          properties:
            total:
              type: "integer"
            success:
              type: "integer"
            failed:
              type: "integer"
            cached:
              type: "integer"
            totalDuration:
              type: "integer"
            costSaved:
              type: "number"
            failedFast:
              type: "boolean"
    BatchDetails:
      type: "object"
      required:
        - "results"
        - "errors"
        - "metadata"
      properties:
        results:
          type: "object"
          additionalProperties:
            $ref: "#/components/schemas/PokemonDetail"
        errors:
          type: "object"
          additionalProperties:
            type: "object"
            required:
              - "code"
              - "message"
        metadata:
          type: "object"
          required:
            - "requested"
            - "found"
            - "failed"
            - "cached"
            - "queryTime"
          properties:
            requested:
              type: "integer"
            found:
              type: "integer"
            failed:
              type: "integer"
            cached:
              type: "integer"
            queryTime:
              type: "integer"
            dbQueries:
              type: "integer"
            partial:
              type: "boolean"
    PokemonDetail:
      allOf:
        - $ref: "#/components/schemas/PokemonSummary"
        - type: "object"
          required:
            - "user_id"
          properties:
            user_id:
              type: "string"
              format: "uuid"
            candy_count:
              type: "integer"
              minimum: 0
            candy_to_evolve:
              type:
                - "integer"
                - "null"
            evolves_to:
              type:
                - "integer"
                - "null"
            base_attack:
              type:
                - "integer"
                - "null"
            base_defense:
              type:
                - "integer"
                - "null"
            base_hp:
              type:
                - "integer"
                - "null"
    PokemonSummary:
      type: "object"
      required:
        - "id"
        - "species_id"
        - "cp"
      properties:
        id:
          type: "string"
          format: "uuid"
        species_id:
          type: "integer"
        nickname:
          type:
            - "string"
